name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

# 同一分支上连续推送时,取消尚未完成的旧运行。标签运行不取消 —— 那是在发布。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # 路径处理在三个平台上行为不同(filepath.Abs 对 `d:\...` 的判定、符号链接、
  # 大小写敏感性),只在 ubuntu 上跑测试会漏掉这类问题,所以三个平台都跑。
  # 这一层同时充当编译验证:go test 会编译全部包。
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.0'
          cache: true
      - run: go test ./...
      - run: go vet ./...

  # 静态检查只在 ubuntu 跑 —— 启用的 linter 结论与平台无关,三份是浪费。
  # 规则见 .golangci.yml,当前无任何豁免,要求全量零问题。
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.0'
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

  # 推送 v* 标签时:编译六个平台并发布 Release。
  # 六平台交叉编译只在这里做 —— 纯 Go 无 cgo,真出问题会在此拦住,不会发出坏产物。
  # 版本号由标签注入(-X main.version),不必再手改源码。
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [test, lint]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # 需要完整历史与标签,才能读到标签注释
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.0'
          cache: true

      - name: Build all platforms
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          mkdir -p dist
          while read -r goos goarch suffix; do
            out="dist/ais-${TAG}-${suffix}"
            echo "building ${out}"
            GOOS="$goos" GOARCH="$goarch" go build \
              -trimpath \
              -ldflags "-s -w -X main.version=${VERSION}" \
              -o "$out" ./cmd/ais
          done <<'TARGETS'
          windows amd64 windows-amd64.exe
          windows arm64 windows-arm64.exe
          darwin  amd64 darwin-amd64
          darwin  arm64 darwin-arm64
          linux   amd64 linux-amd64
          linux   arm64 linux-arm64
          TARGETS
          ls -lh dist/

      - name: Verify injected version
        run: |
          set -euo pipefail
          got="$(./dist/ais-${GITHUB_REF_NAME}-linux-amd64 --version)"
          want="ais ${GITHUB_REF_NAME#v}"
          echo "got: $got"
          [ "$got" = "$want" ] || { echo "版本注入失败, want: $want"; exit 1; }

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          # actions/checkout 会把 refs/tags/<tag> 直接指到 commit SHA,不拉取
          # annotated tag 对象,于是 %(contents:body) 读到的是提交消息而非标签注释。
          # 显式重取标签对象,并确认它确实是 annotated tag 再用它的正文。
          git fetch --force --tags origin
          NOTES=""
          if [ "$(git cat-file -t "$TAG" 2>/dev/null || true)" = "tag" ]; then
            NOTES="$(git for-each-ref "refs/tags/${TAG}" --format='%(contents:body)')"
          fi
          # 说明取自标签注释(git tag -a 写的正文);没有就让 GitHub 按提交自动生成。
          if [ -n "${NOTES//[[:space:]]/}" ]; then
            printf '%s\n' "$NOTES" > dist/notes.md
            NOTE_ARGS=(--notes-file dist/notes.md)
          else
            NOTE_ARGS=(--generate-notes)
          fi
          # 幂等:Release 已存在(例如手工先建过)就只覆盖上传产物。
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release ${TAG} 已存在,覆盖上传产物"
            gh release upload "$TAG" dist/ais-"$TAG"-* --clobber
          else
            gh release create "$TAG" \
              --title "ais $TAG" \
              "${NOTE_ARGS[@]}" \
              dist/ais-"$TAG"-*
          fi
